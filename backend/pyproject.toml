[project]
name = "mentework-api"
version = "0.1.0"
description = "Mentework FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pwdlib[argon2]>=0.2.1",
    "pyjwt>=2.10",
    # Required by FastAPI to accept multipart file uploads.
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Alembic writes these; the long lines are rendered SQL that should not be
# reflowed by hand.
"alembic/versions/*" = ["E501"]

[tool.ruff.lint.isort]
# The local alembic/ migrations directory would otherwise shadow the installed
# alembic package and be sorted as first-party.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
