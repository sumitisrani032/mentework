services:
  postgres:
    image: postgres:16-alpine
    container_name: mentework-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mentework}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mentework}
      POSTGRES_DB: ${POSTGRES_DB:-mentework}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mentework} -d ${POSTGRES_DB:-mentework}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
